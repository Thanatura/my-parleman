[project]
name = "parleman-app"
version = "0.1.0"
description = "FastAPI + Streamlit app for ParlemAN marts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.1",
    "google-cloud-bigquery>=3.38.0",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "requests>=2.32.0",
    "streamlit>=1.49.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "types-requests>=2.32.4.20250913",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
disable_error_code = ["import-untyped"]
explicit_package_bases = true
files = ["app/backend", "app/frontend"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true
